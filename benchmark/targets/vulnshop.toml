[[vuln]]
id = "vs-safe-admin-users"
title = "Control S05: role-checked twin of vs-bac-admin-users"
scan_type = "auth"
cwe = "CWE-862"
expect = "safe"
endpoints = [{ method = "GET", path = "/api/v2/admin/users" }]

[[vuln]]
id = "vs-safe-download"
title = "Control S06: path-checked twin of vs-path-traversal-download"
scan_type = "general"
cwe = "CWE-22"
expect = "safe"
endpoints = [{ method = "GET", path = "/v2/download", param = "file" }]

[[vuln]]
id = "vs-safe-redirect"
title = "Control S07: allow-listed twin of vs-open-redirect"
scan_type = "general"
cwe = "CWE-601"
expect = "safe"
endpoints = [{ method = "GET", path = "/v2/redirect", param = "next" }]

[[vuln]]
id = "vs-safe-login"
title = "Control S08: parameterised twin of vs-sqli-login"
scan_type = "sqli"
cwe = "CWE-89"
expect = "safe"
endpoints = [{ method = "POST", path = "/v2/login", param = "username" }]
